name: Build and proof Blocksync

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv/bin/designbot
            .venv/.crates.toml
            .venv/.crates2.json
            ~/.designbot/cache
          key: designbot-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config ttfautohint
      - run: make setup SETUP_PYTHON=python
      - run: make build
      - run: make test NO_BUILD=1
      - run: make proof NO_BUILD=1
      - run: make qa NO_BUILD=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blocksync-fonts
          path: |
            fonts/
            output/proof/
            output/qa/
            out/fontspector/
            out/badges/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    concurrency: blocksync-pages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: blocksync-fonts
          path: bundle
      - name: Update the existing Pages branch
        run: |
          cp -R bundle/output/proof/. published/proof/
          cp -R bundle/output/qa published/
          cp -R bundle/out/fontspector published/
          cp -R bundle/out/badges/. published/badges/
          cp source/scripts/index.html published/index.html
          cd published
          git add .
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Publish Blocksync proofs for ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: blocksync-fonts
          path: blocksync-fonts
      - run: zip -qr blocksync-fonts.zip blocksync-fonts
      - run: gh release upload "$TAG" blocksync-fonts.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
